services:
    matcher:
        build:
            context: ./java-matcher
        ports:
            - "50051:50051"
        environment:
            # Matches the container's internal port, not the host mapping above,
            # keeping these separate avoids confusion if the host port ever
            # needs to change for local port conflicts.
            MATCHER_PORT: "50051"
            MATCHER_TLS_CERT: /certs/server-cert.pem
            MATCHER_TLS_KEY: /certs/server-key.pem
            MATCHER_TLS_CLIENT_CA: /certs/ca-cert.pem
            MATCHER_TLS_REVOKED_SERIALS: /certs/revoked-serials.txt
        volumes:
            # Read-only, the container only ever needs to present its own
            # cert and verify client certs against the CA, never write here.
            - ./certs:/certs:ro

    postgres:
        image: postgres:16
        ports:
            # 5544 on the host. Both 5432 and 5433 turned out to already be
            # spoken for on this machine (one by a native Postgres install,
            # one by a stale Docker port reservation), picking something far
            # from the default range avoids that whole class of collision.
            - "5544:5432"
        environment:
            # Dev-only credentials, this is why they're inline here rather than
            # in a .env file someone might reuse. Real credentials belong in a
            # secrets manager, never in a committed compose file.
            POSTGRES_USER: biometric
            POSTGRES_PASSWORD: biometric_dev_only
            POSTGRES_DB: biometric
        volumes:
            - pgdata:/var/lib/postgresql/data
            # Runs once, only on an empty data directory, on every subsequent
            # `docker-compose up` this is a no-op, not a re-run migration.
            - ./go-client/migrations:/docker-entrypoint-initdb.d

volumes:
    pgdata:
